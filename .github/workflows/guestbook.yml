name: Guestbook

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  sign:
    # Only react to issues opened through the guestbook form (carries this label).
    if: contains(github.event.issue.labels.*.name, 'guestbook')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add sanitized signature
        # Untrusted input is passed via env, never interpolated into the shell.
        env:
          GH_USER: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 .github/scripts/sign_guestbook.py

      - name: Commit signature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "guestbook: new signature"
          git push

      - name: Thank and close
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: gh issue close "$NUMBER" --repo "$REPO" --comment "Thanks for signing! ✍️ Your note is now on my profile."
