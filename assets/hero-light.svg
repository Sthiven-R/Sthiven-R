<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="840" height="440" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" role="img" aria-label="Sthiven R. — AI Systems Control panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f6f9"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2da44e"/>
      <stop offset="1" stop-color="#1a7f37"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bf8700"/>
      <stop offset="1" stop-color="#9a6700"/>
    </linearGradient>
    <clipPath id="frame"><rect x="8" y="8" width="824" height="424" rx="16"/></clipPath>
  </defs>

  <rect x="8" y="8" width="824" height="424" rx="16" fill="url(#bg)" stroke="#0891b2" stroke-opacity="0.35"/>

  <g clip-path="url(#frame)">
    <rect x="0" y="8" width="3" height="424" fill="#0891b2" opacity="0.10">
      <animateTransform attributeName="transform" type="translate" from="8 0" to="824 0" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g stroke="#0891b2" stroke-width="2" stroke-opacity="0.6" fill="none">
    <path d="M24 40 V24 H40"/>
    <path d="M800 24 H816 V40"/>
    <path d="M24 400 V416 H40"/>
    <path d="M816 400 V416 H800"/>
  </g>

  <text x="40" y="74" font-size="38" font-weight="700" fill="#1f2328" letter-spacing="1">STHIVEN R.</text>
  <text x="42" y="99" font-size="12.5" fill="#0e7490" letter-spacing="3">AI ENGINEER · SYSTEMS BUILDER · FOUNDER</text>

  <g>
    <circle cx="690" cy="42" r="5" fill="#1a7f37">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="704" y="46" font-size="11" letter-spacing="2" fill="#57606a">SYSTEMS ONLINE</text>
  </g>

  <line x1="40" y1="118" x2="800" y2="118" stroke="#d0d7de"/>
  <text x="40" y="140" font-size="11" letter-spacing="3" fill="#8c959f">PRODUCTION SYSTEMS</text>

  <g transform="translate(0,168)">
    <circle cx="46" cy="0" r="5" fill="#1a7f37"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" begin="0s" repeatCount="indefinite"/></circle>
    <text x="66" y="4" font-size="15" fill="#1f2328">DAAEONYX AI</text>
    <text x="66" y="20" font-size="10.5" fill="#8c959f">inference platform · chat · audio · image</text>
    <rect x="430" y="-7" width="250" height="11" rx="5.5" fill="#eaeef2"/>
    <rect x="430" y="-7" width="0" height="11" rx="5.5" fill="url(#green)"><animate attributeName="width" from="0" to="215" dur="1.3s" begin="0.2s" fill="freeze"/></rect>
    <text x="694" y="4" font-size="12" fill="#1a7f37">ONLINE</text>
  </g>
  <g transform="translate(0,212)">
    <circle cx="46" cy="0" r="5" fill="#1a7f37"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" begin="0.45s" repeatCount="indefinite"/></circle>
    <text x="66" y="4" font-size="15" fill="#1f2328">FRONTIER BENCHMARKS</text>
    <text x="66" y="20" font-size="10.5" fill="#8c959f">public LLM benchmark atlas · 120+ models</text>
    <rect x="430" y="-7" width="250" height="11" rx="5.5" fill="#eaeef2"/>
    <rect x="430" y="-7" width="0" height="11" rx="5.5" fill="url(#green)"><animate attributeName="width" from="0" to="250" dur="1.3s" begin="0.35s" fill="freeze"/></rect>
    <text x="694" y="4" font-size="12" fill="#1a7f37">LIVE</text>
  </g>
  <g transform="translate(0,256)">
    <circle cx="46" cy="0" r="5" fill="#bf8700"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" begin="0.9s" repeatCount="indefinite"/></circle>
    <text x="66" y="4" font-size="15" fill="#1f2328">AEONYX</text>
    <text x="66" y="20" font-size="10.5" fill="#8c959f">Rust toolchain · CLI · IDE agent · mobile</text>
    <rect x="430" y="-7" width="250" height="11" rx="5.5" fill="#eaeef2"/>
    <rect x="430" y="-7" width="0" height="11" rx="5.5" fill="url(#amber)"><animate attributeName="width" from="0" to="140" dur="1.3s" begin="0.5s" fill="freeze"/></rect>
    <text x="694" y="4" font-size="12" fill="#bf8700">BUILDING</text>
  </g>
  <g transform="translate(0,300)">
    <circle cx="46" cy="0" r="5" fill="#bf8700"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" begin="1.35s" repeatCount="indefinite"/></circle>
    <text x="66" y="4" font-size="15" fill="#1f2328">JAVRYX</text>
    <text x="66" y="20" font-size="10.5" fill="#8c959f">autonomous software execution system</text>
    <rect x="430" y="-7" width="250" height="11" rx="5.5" fill="#eaeef2"/>
    <rect x="430" y="-7" width="0" height="11" rx="5.5" fill="url(#amber)"><animate attributeName="width" from="0" to="78" dur="1.3s" begin="0.65s" fill="freeze"/></rect>
    <text x="694" y="4" font-size="12" fill="#bf8700">DEV</text>
  </g>

  <path d="M40 350 H250 l10 -22 l8 40 l10 -18 H470 l10 -22 l8 40 l10 -18 H800" fill="none" stroke="#0891b2" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="9 7">
    <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="0.6s" repeatCount="indefinite"/>
  </path>

  <text x="40" y="396" font-size="12" letter-spacing="1.5" fill="#57606a">STACK <tspan fill="#0891b2">▸</tspan> RUST · PYTHON · TYPESCRIPT · GO · vLLM · CLOUDFLARE</text>
  <rect x="724" y="386" width="8" height="14" fill="#0891b2">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
